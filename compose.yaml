services:
  db:
    image: registry.redhat.io/rhel9/postgresql-15
    environment:
      POSTGRESQL_USER: ct-user
      POSTGRESQL_PASSWORD: ct-password
      POSTGRESQL_DATABASE: ct-db
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/ct-db
      QUARKUS_DATASOURCE_USERNAME: ct-user
      QUARKUS_DATASOURCE_PASSWORD: ct-password
    depends_on:
      - db
