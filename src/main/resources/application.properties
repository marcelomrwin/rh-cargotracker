# =============================================================================
# Cargo Tracker - Quarkus 3.40.1 configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Datasource - PostgreSQL (guide: https://quarkus.io/guides/datasource)
# Dev Services auto-provisions a PostgreSQL container in dev/test mode.
# For production, set QUARKUS_DATASOURCE_JDBC_URL etc.
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql

# -----------------------------------------------------------------------------
# Hibernate ORM (guide: https://quarkus.io/guides/hibernate-orm)
# -----------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# -----------------------------------------------------------------------------
# REST path - replaces RestConfiguration JAX-RS Application class
# -----------------------------------------------------------------------------
quarkus.rest.path=/rest

# -----------------------------------------------------------------------------
# Application configuration
# -----------------------------------------------------------------------------
cargo-tracker.graph-traversal-url=http://localhost:8080/rest/graph-traversal/shortest-path

# -----------------------------------------------------------------------------
# Dev profile - local development overrides
# -----------------------------------------------------------------------------
%dev.quarkus.hibernate-orm.log.sql=true
