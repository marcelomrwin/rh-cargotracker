# =============================================================================
# Cargo Tracker - Quarkus 3.40.1 configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Datasource - PostgreSQL (guide: https://quarkus.io/guides/datasource)
# -----------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/cargo-tracker
quarkus.datasource.username=ct-user
quarkus.datasource.password=ct-password

# -----------------------------------------------------------------------------
# Hibernate ORM (guide: https://quarkus.io/guides/hibernate-orm)
# Migrated from persistence.xml CargoTrackerUnit
# Note: hibernate.enable_lazy_load_no_trans is NOT supported in Quarkus.
#       Lazy loading outside transactions must be refactored.
# -----------------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# -----------------------------------------------------------------------------
# REST path - replaces RestConfiguration JAX-RS Application class
# -----------------------------------------------------------------------------
quarkus.rest.path=/rest

# -----------------------------------------------------------------------------
# Dev profile - local development overrides
# -----------------------------------------------------------------------------
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/cargo-tracker
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
